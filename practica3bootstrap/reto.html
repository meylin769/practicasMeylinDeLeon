<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Estado del Servidor</title>
</head>
<body class="bg-light">

    <div class="container mt-5">

        <div class="border p-4 bg-white shadow-sm">

            <h1 class="fw-bold">Estado del Servidor</h1>

            <p class="text-secondary">
                Panel de control de servicios activos.
            </p>

            <hr>

            <!-- ERROR -->
            <div class="alert alert-danger">
                <strong>ERROR CRÍTICO:</strong>
                La base de datos no responde.
            </div>

            <!-- AVISO -->
            <div class="alert alert-warning">
                <strong>Aviso:</strong>
                El espacio en disco está al
                <u>90% de su capacidad</u>.
            </div>

            <!-- SISTEMA -->
            <div class="alert alert-primary">
                <strong>Sistema:</strong>
                Todos los demás servicios están
                <span class="text-uppercase">operativos</span>.
            </div>

            <p class="text-center text-secondary small">
                Última actualización:
                <span>Hace 5 minutos</span>
            </p>

        </div>

    </div>

</body>
</html>
